name: CI/CD Pipeline

on:
  push:
    branches:
      - main # O la rama principal de tu repositorio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest test_app.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/python-hello-world:latest

      - name: Deploy to production (manual step)
        run: |
          echo "Deployment step is completed. Docker image pushed to Docker Hub."
          echo "This is a placeholder for a real production deployment."
          # Aquí iría un comando para desplegar, por ejemplo:
          # ssh user@your_server "docker pull ${{ secrets.DOCKER_USERNAME }}/python-hello-world:latest && docker stop my-app || true && docker rm my-app || true && docker run -d --name my-app -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/python-hello-world:latest"
